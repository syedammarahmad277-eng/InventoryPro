<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Sign in | InventoryPro</title>
    <link rel="stylesheet" href="style.css?v=dashboard-refresh-1">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-body">
    <main class="login-container">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <div class="login-logo" aria-hidden="true">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <span>Inventory<span class="highlight">Pro</span></span>
            </div>

            <p class="login-eyebrow">INVENTORY MANAGEMENT</p>
            <h1 id="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to manage your inventory workspace.</p>

            <form id="login-form">
                <div class="login-field">
                    <label for="login-email">Email address</label>
                    <div class="input-icon">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <input
                            id="login-email"
                            name="email"
                            type="email"
                            autocomplete="username"
                            placeholder="you@example.com"
                            required
                            autofocus>
                    </div>
                </div>

                <div class="login-field">
                    <label for="login-password">Password</label>
                    <div class="input-icon password-input">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input
                            id="login-password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required>
                        <button
                            class="password-toggle"
                            id="password-toggle"
                            type="button"
                            aria-label="Show password"
                            aria-pressed="false">
                            <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <p id="login-error" role="alert" aria-live="polite"></p>
                <button class="login-btn" id="login-submit" type="submit">
                    <span>Sign in</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="login-footnote">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                Your workspace is protected by secure sign-in.
            </p>
        </section>
    </main>
    <script src="auth.js?v=auth-login-1"></script>
    <script src="login.js?v=auth-login-1"></script>
</body>
</html>
